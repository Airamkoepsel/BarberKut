<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230B1F3A%22/><text y=%22.9em%22 font-size=%2272%22 x=%2250%25%22 text-anchor=%22middle%22>✂</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Minha conta na BarberKut — agendamentos, favoritos e perfil." />
  <title>Minha conta — BarberKut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/upgrade.css" />
  <style>
    .bc-g1{background:linear-gradient(140deg,#0B1F3A,#1A3A6B)}
    .bc-g2{background:linear-gradient(140deg,#1A1A2E,#16213E)}
    .bc-g3{background:linear-gradient(140deg,#2D1B69,#1A1033)}
    .bc-g4{background:linear-gradient(140deg,#1B2838,#0B1F3A)}
    .bc-g5{background:linear-gradient(140deg,#0D2137,#1E3A4A)}
    .bc-g6{background:linear-gradient(140deg,#1A0B2E,#2D1B69)}

    /* ── HEADER DO PERFIL ─────────────────────────────────────── */
    .profile-header { border-radius: var(--radius-2xl); overflow: hidden; border: 1px solid var(--color-border); background: var(--color-surface); margin: var(--space-8) 0; }
    .profile-header__cover { height: 120px; background: var(--grad-hero); position: relative; }
    .profile-header__cover::after { content:''; position:absolute; inset:0; background: var(--grad-mesh); opacity:.7; }
    .profile-header__bar { display: flex; align-items: flex-end; gap: var(--space-5); padding: 0 var(--space-8) var(--space-6); margin-top: -44px; position: relative; flex-wrap: wrap; }
    .profile-avatar {
      width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0;
      background: var(--grad-navy); color: #fff; border: 4px solid var(--color-surface);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--text-2xl); font-weight: var(--fw-bold);
      background-size: cover; background-position: center;
    }
    .profile-header__info { flex: 1; min-width: 200px; padding-bottom: var(--space-1); }
    .profile-header__info h1 { font-size: var(--text-2xl); color: var(--color-navy); margin: 0; }
    .profile-header__info p { font-size: var(--text-sm); color: var(--color-text-muted); margin: 2px 0 0; }
    .profile-header__actions { display: flex; gap: var(--space-2); padding-bottom: var(--space-1); flex-wrap: wrap; }

    /* ── STATS ────────────────────────────────────────────────── */
    .profile-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: var(--space-4); margin-bottom: var(--space-10); }
    .pstat { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: var(--space-5); text-align: center; }
    .pstat__value { font-size: var(--text-2xl); font-weight: var(--fw-extrabold); color: var(--color-navy); }
    .pstat__label { font-size: var(--text-xs); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }

    /* ── SEÇÕES ───────────────────────────────────────────────── */
    .profile-section { margin-bottom: var(--space-10); }
    .profile-section__title { font-size: var(--text-lg); color: var(--color-navy); margin-bottom: var(--space-4); display: flex; align-items: center; gap: var(--space-2); }

    /* agendamentos */
    .appt-card { display: flex; align-items: center; gap: var(--space-4); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: var(--space-4) var(--space-5); margin-bottom: var(--space-3); }
    .appt-card__icon { width: 48px; height: 48px; border-radius: var(--radius-lg); background: var(--grad-navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
    .appt-card__info { flex: 1; min-width: 0; }
    .appt-card__svc { font-weight: var(--fw-semibold); color: var(--color-navy); }
    .appt-card__meta { font-size: var(--text-sm); color: var(--color-text-muted); }
    .appt-card__when { text-align: right; flex-shrink: 0; }
    .appt-card__date { font-weight: var(--fw-semibold); color: var(--color-navy); font-size: var(--text-sm); }
    .appt-card__time { font-size: var(--text-sm); color: var(--color-red); font-weight: var(--fw-semibold); }

    /* favoritos */
    .fav-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(230px,1fr)); gap: var(--space-4); }
    .fav-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl); overflow: hidden; transition: transform var(--transition-spring), box-shadow var(--transition-spring); position: relative; }
    .fav-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .fav-card__cover { height: 90px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: rgba(255,255,255,.25); }
    .fav-card__body { padding: var(--space-4); }
    .fav-card__name { font-weight: var(--fw-semibold); color: var(--color-navy); }
    .fav-card__meta { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 2px; }
    .fav-card__rm { position: absolute; top: var(--space-2); right: var(--space-2); width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(0,0,0,.45); color: #fff; cursor: pointer; font-size: 14px; }

    /* estado vazio */
    .empty-state { text-align: center; padding: var(--space-10); background: var(--color-surface); border: 1px dashed var(--color-border); border-radius: var(--radius-xl); }
    .empty-state__icon { font-size: 2.5rem; margin-bottom: var(--space-2); }
    .empty-state p { color: var(--color-text-muted); margin-bottom: var(--space-4); }

    /* editar foto no modal */
    .edit-photo { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-5); }
    .edit-photo__preview { width: 72px; height: 72px; border-radius: 50%; background: var(--grad-navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: var(--text-xl); font-weight: var(--fw-bold); background-size: cover; background-position: center; flex-shrink: 0; }

    @media (max-width: 600px) {
      .profile-stats { grid-template-columns: 1fr; }
      .profile-header__bar { flex-direction: column; align-items: flex-start; }
      .appt-card { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<!-- ══════════════ NAV ══════════════ -->
<nav class="nav" id="mainNav">
  <div class="nav__inner">
    <a href="index.html" class="nav__logo">
      <img src="img/logo_navy.png" alt="" aria-hidden="true" class="logo-nav" style="height:28px" />
      Barber<span>Kut</span>
    </a>
    <div class="nav__links">
      <a href="index.html" class="nav__link">Início</a>
      <a href="index.html#discoverySection" class="nav__link">Barbearias</a>
      <a href="ai-simulator.html" class="nav__link">Simulador IA</a>
      <a href="admin.html" class="nav__link">Painel Admin</a>
    </div>
    <div class="nav__actions">
      <button class="btn btn--ghost btn--sm" onclick="location.href='entrar.html'">Entrar</button>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Alternar tema" title="Alternar tema">
        <span class="theme-toggle__icon">🌙</span>
      </button>
      <div class="avatar" title="Perfil">JS</div>
    </div>
    <button class="nav__hamburger" id="hbg" aria-label="Menu" onclick="toggleNav()">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="nav__mobile-menu" id="mobileMenu">
  <a href="index.html" class="nav__mobile-link">🏠 Início</a>
  <a href="index.html#discoverySection" class="nav__mobile-link">✂ Barbearias</a>
  <a href="ai-simulator.html" class="nav__mobile-link">🤖 Simulador IA</a>
  <a href="admin.html" class="nav__mobile-link">📊 Painel Admin</a>
</div>

<div class="toast-container" id="tc"></div>

<!-- ══════════════ CONTEÚDO ══════════════ -->
<div class="container">

  <!-- Header do perfil -->
  <div class="profile-header">
    <div class="profile-header__cover"></div>
    <div class="profile-header__bar">
      <div class="profile-avatar" id="pAvatar"></div>
      <div class="profile-header__info">
        <h1 id="pName">—</h1>
        <p id="pEmail">—</p>
        <p id="pMeta">—</p>
      </div>
      <div class="profile-header__actions">
        <button class="btn btn--secondary btn--sm" onclick="openEdit()">✎ Editar perfil</button>
        <button class="btn btn--ghost btn--sm" onclick="bkLogout()">Sair</button>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="profile-stats" id="pStats"></div>

  <!-- Agendamentos -->
  <section class="profile-section">
    <h2 class="profile-section__title">📅 Meus agendamentos</h2>
    <div id="apptList"></div>
  </section>

  <!-- Favoritos -->
  <section class="profile-section">
    <h2 class="profile-section__title">❤ Barbearias favoritas</h2>
    <div id="favList"></div>
  </section>

</div>

<!-- ══════════════ MODAL EDITAR PERFIL ══════════════ -->
<div class="modal-overlay" id="mEdit">
  <div class="modal modal--center">
    <div class="modal__header">
      <span class="modal__title">Editar perfil</span>
      <button class="btn-icon btn-icon--sm" onclick="closeModal('mEdit')" aria-label="Fechar">✕</button>
    </div>
    <div class="modal__body">
      <div class="edit-photo">
        <div class="edit-photo__preview" id="editPhotoPreview"></div>
        <div>
          <button class="btn btn--secondary btn--sm" onclick="document.getElementById('photoInput').click()" type="button">📷 Trocar foto</button>
          <button class="btn btn--ghost btn--sm" onclick="clearPhoto()" type="button">Remover</button>
          <input type="file" id="photoInput" accept="image/*" onchange="onPhotoPick(this)" hidden />
        </div>
      </div>
      <div class="form-group" style="margin-bottom:var(--space-4)">
        <label class="form-label">Nome completo</label>
        <input class="form-control" type="text" id="editName" />
      </div>
      <div class="form-group" style="margin-bottom:var(--space-4)">
        <label class="form-label">E-mail</label>
        <input class="form-control" type="email" id="editEmail" disabled />
      </div>
      <div class="form-group">
        <label class="form-label">Telefone</label>
        <input class="form-control" type="tel" id="editPhone" placeholder="(47) 99999-9999" oninput="fmtPhone(this)" maxlength="15" />
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost" onclick="closeModal('mEdit')">Cancelar</button>
      <button class="btn btn--primary" onclick="saveProfile()">Salvar alterações</button>
    </div>
  </div>
</div>

<!-- ══════════════ FOOTER ══════════════ -->
<footer class="footer">
  <div class="container">
    <div class="footer__bottom" style="border:none">
      <span>© 2026 BarberKut. Todos os direitos reservados.</span>
      <span>Desenvolvido com ❤ em Timbó, SC</span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/global.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
